<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0708"><meta name="description" content="Para mi corazón de melón."><title>Para mi corazón de melón</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;font-family:Georgia,'Times New Roman',serif;color:#f6e7e5;background:#0a0708;transition:background-color .9s ease}*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow-x:hidden;background:#0a0708;transition:background-color .9s ease}
main{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px 28px}
main::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,#1f0e1366,transparent 62%);pointer-events:none;transition:opacity 1.6s ease}main>*{position:relative}
header{text-align:center;transition:opacity 1.6s ease .2s}.eyebrow{font:11px Arial,sans-serif;letter-spacing:5px;text-transform:uppercase;color:#b99b9f;margin:0 0 12px}
h1{font-weight:normal;font-size:clamp(28px,6vw,44px);margin:0;letter-spacing:.2px}h1 em{color:#f09aab}
.art{position:relative;width:min(94vw,680px,72svh);aspect-ratio:1;margin:14px 0 4px}canvas{width:100%;height:100%;display:block}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease;pointer-events:none}
.hint svg{width:clamp(48px,13vw,60px);height:auto;overflow:visible;fill:none;stroke:#f09aab;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(240,154,171,.28));animation:lubdub 2.4s infinite}.hint path{vector-effect:non-scaling-stroke}.started .hint{opacity:0}
.message{text-align:center;min-height:40px;margin:0;font-style:italic;font-size:26px;color:#f09aab;letter-spacing:.5px;opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease}.complete .message{opacity:1;transform:none}
.complete button{background:transparent;border-color:#4a2a33;color:#d9b9c1}
button{cursor:pointer;border:1px solid #75414e;background:#221017;color:#fce8ef;border-radius:40px;padding:15px 27px;font:12px Arial,sans-serif;letter-spacing:1px;min-width:176px;min-height:46px;transition:background .2s,border-color .2s,opacity .6s}button:hover{background:#3d1625;border-color:#d57d94}button:focus-visible{outline:2px solid #f6c5d0;outline-offset:5px}button:disabled{cursor:default;opacity:.45}
.controls{text-align:center;margin-top:18px;transition:opacity 1s ease 1.4s}.status{font:11px Arial,sans-serif;color:#a58b91;letter-spacing:1px;min-height:16px;margin:13px 0 0}
/* Dark stage: everything but the canvas fades away while the portrait is written. */
html.dark,html.dark body{background-color:#000}.dark main::before,.dark header,.dark .controls,.dark .message{opacity:0;pointer-events:none;transition:opacity .9s ease}.dark .message{transform:translateY(6px)}
.fading canvas{opacity:0;transition:opacity .9s ease}

'use strict';
const root=document.documentElement,themeMeta=document.querySelector('meta[name=theme-color]'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),main=document.getElementById('main'),play=document.getElementById('play'),status=document.getElementById('status'),message=document.getElementById('message');
// Everything is drawn in a 1000×1000 coordinate system, scaled to the real pixel size.
const S=1000,DURATION=12000,FADE=420,DIM=950;
const TURNS=17,R_MAX=484,R_MIN=34,FONT=22,FAMILY="Nunito,'Segoe UI',Arial,sans-serif";
const PHRASE='te amo · ',WEIGHTS=[600,800,900];
let marks=[],ready=false,frame=0,dimTimer=0,start=0,committed=0,shown=0,finished=false,scale=1;
const base=document.createElement('canvas'),bctx=base.getContext('2d');
const photo=new Image();
play.disabled=true;status.textContent='Preparando algo para usted…';
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function fitCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const px=Math.min(2400,Math.round(canvas.getBoundingClientRect().width*dpr))||1000;
  if(canvas.width===px)return false;
  canvas.width=canvas.height=base.width=base.height=px;scale=px/S;return true;
}

function buildMarks(){
  // Average the photo over ~5-unit cells so each letter gets a calm, representative colour.
  const G=200,cell=S/G,sample=document.createElement('canvas');sample.width=sample.height=G;
  const sc=sample.getContext('2d',{willReadFrequently:true});sc.imageSmoothingQuality='high';
  sc.drawImage(photo,0,0,G,G);const px=sc.getImageData(0,0,G,G).data;
  // Auto-levels: the portrait is dark, so stretch its own tonal range to the full 0–1.
  const lums=[];for(let i=0;i<px.length;i+=4)lums.push((.299*px[i]+.587*px[i+1]+.114*px[i+2])/255);
  lums.sort((a,b)=>a-b);const lo=lums[Math.floor(lums.length*.03)],hi=lums[Math.floor(lums.length*.985)];
  const widths=WEIGHTS.map(w=>{ctx.font=w+' '+FONT+'px '+FAMILY;const o={};for(const c of new Set(PHRASE))o[c]=ctx.measureText(c).width;return o;});
  const b=(R_MAX-R_MIN)/(TURNS*2*Math.PI);
  let theta=R_MIN/b,letter=0;
  marks=[];
  while(true){
    const c=PHRASE[letter%PHRASE.length];
    const r0=b*theta;if(r0>R_MAX)break;
    // Sample at the letter's position to pick its weight, then advance by its real width.
    const sx=clamp(Math.floor((S/2+r0*Math.cos(theta))/cell),0,G-1),sy=clamp(Math.floor((S/2+r0*Math.sin(theta))/cell),0,G-1);
    const i=(sy*G+sx)*4;let R=px[i],Gr=px[i+1],B=px[i+2];
    const raw=(.299*R+.587*Gr+.114*B)/255,lum=clamp((raw-lo)/(hi-lo),0,1);
    const wi=lum<.3?0:lum<.62?1:2;
    const w=widths[wi][c]+FONT*.06;
    const mid=theta+(w/2)/Math.hypot(r0,b);
    const r=b*mid,x=S/2+r*Math.cos(mid),y=S/2+r*Math.sin(mid);
    // Lift dark tones so the phrase never disappears; keep the photo's hue with a little extra warmth.
    const target=.2+.8*Math.pow(lum,1.05);
    const k=target/Math.max(raw,.02);
    const dark=clamp(1-lum*3,0,1);
    R=clamp(R*k*(1-dark)+178*target/.5*dark,0,255);Gr=clamp(Gr*k*(1-dark)+104*target/.5*dark,0,255);B=clamp(B*k*(1-dark)+118*target/.5*dark,0,255);
    const avg=(R+Gr+B)/3,sat=1.18;
    R=clamp(avg+(R-avg)*sat+6,0,255);Gr=clamp(avg+(Gr-avg)*sat,0,255);B=clamp(avg+(B-avg)*sat-4,0,255);
    marks.push({x,y,a:mid+Math.PI/2,c,font:WEIGHTS[wi]+' '+FONT+'px '+FAMILY,fill:'rgb('+(R|0)+','+(Gr|0)+','+(B|0)+')',alpha:.5+.5*lum,t:0});
    theta+=w/Math.hypot(r0,b);letter++;
  }
}
photo.onload=async()=>{
  try{await document.fonts.load('900 '+FONT+'px Nunito');await document.fonts.load('600 '+FONT+'px Nunito');await document.fonts.load('800 '+FONT+'px Nunito');}catch(e){}
  buildMarks();fitCanvas();
  ready=true;play.disabled=false;status.textContent='';
};
photo.onerror=()=>{status.textContent='No se pudo cargar el retrato. Recargue la página para intentarlo de nuevo.';play.textContent='Recargar';play.disabled=false;play.onclick=()=>location.reload();};

function drawMark(c,m,alpha,grow){
  c.save();c.translate(m.x,m.y);c.rotate(m.a);if(grow!==1)c.scale(grow,grow);
  c.globalAlpha=alpha;c.font=m.font;c.fillStyle=m.fill;c.fillText(m.c,0,0);c.restore();
}
function prep(c){c.setTransform(scale,0,0,scale,0,0);c.textAlign='center';c.textBaseline='middle';}
function redrawBase(){
  bctx.setTransform(1,0,0,1,0,0);bctx.clearRect(0,0,base.width,base.height);prep(bctx);
  for(let i=0;i<committed;i++)drawMark(bctx,marks[i],marks[i].alpha,1);
}
function render(now,glow){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(base,0,0);prep(ctx);
  // Letters still fading in: they arrive slightly larger and settle into place.
  for(let i=committed;i<shown;i++){
    const m=marks[i],k=clamp((now-m.t)/FADE,0,1),e=1-Math.pow(1-k,3);
    drawMark(ctx,m,m.alpha*e,1.25-.25*e);
  }
  if(glow>0&&shown>0){
    const m=marks[shown-1],g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,34);
    g.addColorStop(0,'rgba(255,214,200,'+.55*glow+')');g.addColorStop(.35,'rgba(255,120,150,'+.22*glow+')');g.addColorStop(1,'rgba(255,90,130,0)');
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(m.x-34,m.y-34,68,68);ctx.globalCompositeOperation='source-over';
  }
}
function commit(now){
  prep(bctx);
  while(committed<shown&&now-marks[committed].t>=FADE){const m=marks[committed++];drawMark(bctx,m,m.alpha,1);}
}
function done(){
  finished=true;root.classList.remove('dark');themeMeta.content='#0a0708';main.classList.add('complete');message.setAttribute('aria-hidden','false');
  play.disabled=false;play.textContent='Otra vez';
}
let endAt=0;
function animate(now){
  if(!start)start=now;
  const p=clamp((now-start)/DURATION,0,1),target=Math.round(ease(p)*marks.length);
  while(shown<target)marks[shown++].t=now;
  commit(now);
  if(p>=1&&!endAt)endAt=now;
  const glow=endAt?clamp(1-(now-endAt)/600,0,1):clamp((now-start)/500,0,1);
  render(now,glow);
  if(committed<marks.length||glow>0)frame=requestAnimationFrame(animate);
  else done();
}
function drawAll(){committed=shown=marks.length;redrawBase();render(0,0);}
play.addEventListener('click',()=>{
  if(!ready)return;
  cancelAnimationFrame(frame);clearTimeout(dimTimer);finished=false;
  main.classList.add('started');main.classList.remove('complete');message.setAttribute('aria-hidden','true');
  play.disabled=true;
  const reset=()=>{fitCanvas();committed=shown=0;start=0;endAt=0;redrawBase();render(0,0);};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){reset();drawAll();done();return;}
  // Fade the whole page (and any previous portrait) to pure black, then let the pen tip appear.
  root.classList.add('dark');main.classList.add('fading');themeMeta.content='#000000';
  dimTimer=setTimeout(()=>{reset();main.classList.remove('fading');frame=requestAnimationFrame(animate);},DIM);
});
addEventListener('resize',()=>{if(ready&&fitCanvas()){redrawBase();if(finished)render(0,0);}});
